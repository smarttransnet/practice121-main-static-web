<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting | Practice 121</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #94accc 0%, #ced7e2 50%, #eaeef2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      color: #065f46;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(16,185,129,0.2);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Redirecting you securely...</h1>
  <p>Please wait a moment.</p>

  <script>
    const ROUTES = {
      login:  'https://storage.googleapis.com/practice121-fe-client/index.html#/login',
      signup: 'https://storage.googleapis.com/practice121-fe-client/index.html#/signup',
    };

    const params = new URLSearchParams(window.location.search);
    const dest = params.get('to');
    const url = ROUTES[dest];

    if (url) {
      // Replace current history entry so the user cannot see this page's URL on back
      window.location.replace(url);
    } else {
      window.location.replace('index.html');
    }
  </script>
</body>
</html>
