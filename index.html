<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Practice 121 - Your Health, Our Priority. Quality healthcare services you can trust.">
  <title>Practice 121 | Your Health, Our Priority</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="top-bar"></div>

  <header class="site-header">
    <div class="logo"><a href="index.html">Practice 121</a></div>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" class="active">Home</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-and-conditions.html">Terms &amp; Conditions</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Welcome">
      <h1 class="hero-tagline">Your Health, Our Priority</h1>
    </section>

    <section class="contact-section" id="contact">
      <h2>Contact Us</h2>
      <div class="contact-divider"></div>
      <p class="contact-subtitle">Drop us a line!</p>

      <form class="contact-form" action="mailto:info@practice121.com" method="post" enctype="text/plain">
        <input type="text" name="name" placeholder="Name" required aria-label="Your name">
        <input type="email" name="email" placeholder="Email" required aria-label="Your email">
        <textarea name="message" placeholder="Message" required aria-label="Your message"></textarea>
        <button type="submit">Send Message</button>
      </form>

      <p class="contact-info">
        Or email us directly at <a href="mailto:info@practice121.com">info@practice121.com</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <nav aria-label="Footer navigation">
      <a href="index.html">Home</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-and-conditions.html">Terms &amp; Conditions</a>
    </nav>
    <p>&copy; 2026 Practice 121. All rights reserved.</p>
  </footer>
</body>
</html>
